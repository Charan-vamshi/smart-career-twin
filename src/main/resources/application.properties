spring.application.name=smart-career-twin

# Database Properties
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Google OAuth2 Properties
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# Custom Properties
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}
jwt.secret=${JWT_SECRET}

# Frontend redirect URL (set FRONTEND_URL env var on Render)
app.frontend.redirect-url=${FRONTEND_URL:http://localhost:3000}/oauth2/redirect
